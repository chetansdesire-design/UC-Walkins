<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Walkins Tracker | Target Pulse</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root { 
            --primary: #4f46e5; --success: #10b981; --danger: #ef4444; 
            --dark: #1e293b; --white: #ffffff;
            --gold: #fbbf24; --silver: #94a3b8; --bronze: #b45309;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; margin: 0; color: var(--dark); }

        #authScreen { position: fixed; inset: 0; background: var(--dark); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--white); padding: 40px; border-radius: 24px; width: 100%; max-width: 380px; text-align: center; }

        nav { background: var(--white); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .nav-logo { font-weight: 900; font-size: 1.1rem; color: var(--primary); text-transform: uppercase; }
        .nav-btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 12px; }

        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .hidden { display: none !important; }
        .card { background: var(--white); padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .leader-item { display: flex; align-items: center; padding: 15px; border-radius: 15px; background: #f8fafc; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .leader-rank { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; margin-right: 15px; color: white; }
        .rank-bg-1 { background: var(--gold); }
        .rank-bg-2 { background: var(--silver); }
        .rank-bg-3 { background: var(--bronze); }
        .leader-info { flex: 1; }
        .leader-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        
        .pulse-badge { font-size: 9px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; font-weight: 900; }
        .pulse-on { background: #dcfce7; color: #166534; border: 1px solid #16a34a; }
        .pulse-off { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }

        .progress-bar { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; transition: 0.5s ease-in-out; }
        .target-marker { position: absolute; left: 20%; top: 0; bottom: 0; width: 2px; background: #1e293b; z-index: 5; opacity: 0.3; }

        .leader-stats { text-align: right; margin-left: 20px; }
        .leader-conv { font-weight: 800; font-size: 16px; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { padding: 20px; border-radius: 20px; color: white; text-align: center; }
        .bg-blue { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .bg-purple { background: linear-gradient(135deg, #a855f7, #7c3aed); }

        /* Salesman Breakdown Grid */
        .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .breakdown-card { background: #f8fafc; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; text-align: center; }
        .breakdown-label { font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .breakdown-val { font-size: 18px; font-weight: 800; }

        select, input { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 12px; font-weight: 600; font-size: 14px; }
        .btn-reset { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 20px; font-size: 10px; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="auth-card">
        <h2 style="color:var(--primary)">STORE TRACKER</h2>
        <input type="password" id="mainPass" placeholder="Password" style="width:100%; text-align:center; font-size:18px; margin-bottom:20px;">
        <button class="nav-btn" style="width:100%; height:45px;" onclick="checkAuth()">SIGN IN</button>
    </div>
</div>

<div id="mainApp" class="hidden">
    <nav>
        <div class="nav-logo">Retail Pulse</div>
        <button class="nav-btn" onclick="adminAccess()">ADMIN DASHBOARD</button>
    </nav>

    <div class="container">
        <div id="userPage">
            <div class="card" style="max-width: 450px; margin: 0 auto 20px;">
                <h3 style="text-align:center;">Daily Entry</h3>
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <label style="font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: -8px;">SELECT DATE</label>
                    <input type="date" id="entryDate">
                    <select id="salesman"><option value="Adarsh">Adarsh</option><option value="Arun">Arun</option><option value="Javid">Javid</option></select>
                    <select id="status"><option value="Billed">Billed</option><option value="Not Billed">Not Billed</option></select>
                    <button class="nav-btn" id="logBtn" style="height:50px;" onclick="addEntry()">LOG WALK-IN</button>
                </div>
            </div>
            <div class="card">
                <h3>Today's Log</h3>
                <table id="userLogTable" style="width:100%; border-collapse:collapse; font-size:14px;">
                    <thead><tr style="text-align:left; color:#64748b;"><th>Time</th><th>Salesman</th><th>Status</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="adminPage" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">Performance Tracking</h2>
                <div style="display:flex; gap:8px;">
                    <select id="filterMonth" onchange="updateUI()"></select>
                    <select id="filterYear" onchange="updateUI()"></select>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-card bg-blue">
                    <div style="font-size:11px; opacity:0.8;">OVERALL CONVERSION</div>
                    <div id="storeConvRate" style="font-size:28px; font-weight:800;">0%</div>
                    <div style="font-size:10px;">Monthly Target: 20%</div>
                </div>
                <div class="stat-card bg-purple">
                    <div style="font-size:11px; opacity:0.8;">TOTAL BILLED</div>
                    <div id="totalBills" style="font-size:28px; font-weight:800;">0</div>
                    <div id="billedDiff" style="font-size:10px;">Records Found</div>
                </div>
            </div>

            <div class="card">
                <h3>Salesman Monthly Breakdown</h3>
                <div id="salesmanBreakdown" class="breakdown-grid"></div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3 style="margin:0;">Leaderboard (Target: 20%)</h3>
                </div>
                <div id="leaderboardList"></div>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:20px;">
                <div class="card"><h3>Total Store Ratio</h3><div style="height:250px;"><canvas id="pieChart"></canvas></div></div>
                <div class="card"><h3>Traffic Analysis</h3><div style="height:250px;"><canvas id="lineChart"></canvas></div></div>
            </div>

            <div style="text-align:center; margin-top:30px;">
                <button class="nav-btn" style="background:#64748b" onclick="logoutAdmin()">RETURN TO ENTRY</button><br>
                <button class="btn-reset" onclick="resetData()">WIPE DATABASE</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://daily-walkins-5fa02-default-rtdb.firebaseio.com/",
        projectId: "daily-walkins-5fa02",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    Chart.register(ChartDataLabels);
    let entries = [];
    let pieChart, lineChart;
    const TARGET_PERCENT = 20;

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('entryDate').value = today;
    };

    db.ref('walkin_data').on('value', (snapshot) => {
        const data = snapshot.val();
        entries = data ? Object.values(data) : [];
        updateUI();
    });

    function checkAuth() {
        const p = document.getElementById('mainPass').value;
        if (p === "user" || p === "admin789") {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            setupApp();
        }
    }

    function setupApp() {
        const mS = document.getElementById('filterMonth');
        mS.innerHTML = "";
        ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].forEach((m, i) => mS.innerHTML += `<option value="${i}">${m}</option>`);
        document.getElementById('filterYear').innerHTML = `<option value="2025">2025</option><option value="2026">2026</option>`;
        const now = new Date();
        mS.value = now.getMonth();
        document.getElementById('filterYear').value = now.getFullYear();
    }

    function adminAccess() {
        if (prompt("Admin Password:") === "admin789") {
            document.getElementById('userPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
            updateUI();
        }
    }

    function logoutAdmin() {
        document.getElementById('adminPage').classList.add('hidden');
        document.getElementById('userPage').classList.remove('hidden');
    }

    function addEntry() {
        const selectedDateStr = document.getElementById('entryDate').value;
        if(!selectedDateStr) return alert("Please select a date.");
        const selectedDate = new Date(selectedDateStr);
        const now = new Date();
        const btn = document.getElementById('logBtn');
        const newEntry = {
            date: selectedDateStr,
            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
            salesman: document.getElementById('salesman').value,
            status: document.getElementById('status').value,
            month: selectedDate.getMonth().toString(),
            year: selectedDate.getFullYear().toString(),
            timestamp: Date.now()
        };
        btn.disabled = true;
        btn.innerText = "SAVING...";
        db.ref('walkin_data').push(newEntry).then(() => {
            btn.disabled = false;
            btn.innerText = "LOG WALK-IN";
            alert("Entry Logged!");
        });
    }

    function updateUI() {
        const fM = document.getElementById('filterMonth').value;
        const fY = document.getElementById('filterYear').value;
        const periodData = entries.filter(e => String(e.month) === String(fM) && String(e.year) === String(fY));
        const todayStr = new Date().toISOString().split('T')[0];
        const todayData = entries.filter(e => e.date === todayStr);

        const totalBilled = periodData.filter(e => e.status === 'Billed').length;
        const storeConv = periodData.length > 0 ? (totalBilled/periodData.length*100) : 0;
        document.getElementById('storeConvRate').innerText = storeConv.toFixed(1) + "%";
        document.getElementById('totalBills').innerText = totalBilled;

        const salesmen = ['Adarsh', 'Arun', 'Javid'];
        
        // Month-wise Breakdown UI
        document.getElementById('salesmanBreakdown').innerHTML = salesmen.map(name => {
            const sData = periodData.filter(e => e.salesman === name);
            const b = sData.filter(e => e.status === 'Billed').length;
            const nb = sData.length - b;
            const c = sData.length > 0 ? (b / sData.length * 100).toFixed(1) : 0;
            return `
                <div class="breakdown-card">
                    <div style="font-weight:900; color:var(--primary); margin-bottom:10px; border-bottom:1px solid #e2e8f0; padding-bottom:5px;">${name.toUpperCase()}</div>
                    <div style="display:flex; justify-content:space-around;">
                        <div><div class="breakdown-label">Billed</div><div class="breakdown-val" style="color:var(--success)">${b}</div></div>
                        <div><div class="breakdown-label">Not Billed</div><div class="breakdown-val" style="color:var(--danger)">${nb}</div></div>
                        <div><div class="breakdown-label">Conv.</div><div class="breakdown-val">${c}%</div></div>
                    </div>
                </div>
            `;
        }).join('');

        // Leaderboard UI
        let leaders = salesmen.map(name => {
            const sData = periodData.filter(e => e.salesman === name);
            const b = sData.filter(e => e.status === 'Billed').length;
            const c = sData.length > 0 ? (b / sData.length * 100) : 0;
            return { name, total: sData.length, billed: b, conv: c };
        }).sort((a, b) => b.conv - a.conv);

        document.getElementById('leaderboardList').innerHTML = leaders.map((s, i) => {
            const isMeetingTarget = s.conv >= TARGET_PERCENT;
            const barColor = isMeetingTarget ? 'var(--success)' : 'var(--danger)';
            return `
                <div class="leader-item">
                    <div class="leader-rank rank-bg-${i+1}">${i+1}</div>
                    <div class="leader-info">
                        <div class="leader-name">${s.name} <span class="pulse-badge ${isMeetingTarget?'pulse-on':'pulse-off'}">${isMeetingTarget?'Target Met':'Below'}</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${s.conv}%; background:${barColor}"></div></div>
                    </div>
                    <div class="leader-stats"><div class="leader-conv" style="color:${barColor}">${s.conv.toFixed(1)}%</div></div>
                </div>
            `;
        }).join('');

        document.querySelector('#userLogTable tbody').innerHTML = todayData.slice().reverse().map(e => `
            <tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:10px 0;">${e.time}</td><td>${e.salesman}</td><td style="color:${e.status==='Billed'?'var(--success)':'var(--danger)'}; font-weight:700;">${e.status}</td></tr>
        `).join('');

        if (!document.getElementById('adminPage').classList.contains('hidden')) renderCharts(periodData, totalBilled, periodData.length - totalBilled);
    }

    function renderCharts(periodData, billed, notBilled) {
        if (pieChart) pieChart.destroy();
        pieChart = new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: { labels: ['Success', 'Fail'], datasets: [{ data: [billed, notBilled], backgroundColor: ['#10b981', '#f87171'], cutout: '70%' }] },
            options: { maintainAspectRatio: false, plugins: { datalabels: { display: true, color: '#fff' } } }
        });
        const dates = [...new Set(periodData.map(e => e.date))].sort();
        if (lineChart) lineChart.destroy();
        lineChart = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: { labels: dates.map(d => d.slice(8)), datasets: [{ label: 'Walk-ins', data: dates.map(d => periodData.filter(e => e.date === d).length), borderColor: '#4f46e5', tension: 0.3 }] },
            options: { maintainAspectRatio: false, plugins: { datalabels: { display: false } } }
        });
    }

    function resetData() {
        if (confirm("Delete all cloud records?")) db.ref('walkin_data').remove();
    }
</script>
</body>
</html>
